name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest
      - run: decksignal validate benchmark/tasks
      - run: decksignal validate submissions/example.manifest.json --schema benchmark/schema/submission.schema.json
      - run: decksignal validate submissions/example.evidence.json --schema benchmark/schema/evidence.schema.json
      - run: decksignal validate data/products --schema benchmark/schema/product-snapshot.schema.json
      - run: decksignal validate data/discovery/example.json --schema benchmark/schema/discovery.schema.json
      - run: decksignal validate data/recommendations --schema benchmark/schema/recommendation-source.schema.json
      - run: decksignal validate data/workflows --schema benchmark/schema/workflow-snapshot.schema.json
      - run: decksignal validate data/sources/catalog-v0.1.json --schema benchmark/schema/source-catalog.schema.json
      - run: >-
          decksignal rank data/evidence
          --products data/products
          --workflows data/workflows
          --config benchmark/config/capabilities-v0.2.yaml
          --as-of 2026-09-06T00:00:00Z
          --output public/rankings.json
      - run: decksignal build-site public/rankings.json --products data/products --workflows data/workflows --sources data/sources/catalog-v0.1.json --research data/research/landscape-v0.1.json --output-dir public/site
