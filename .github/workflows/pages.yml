name: Build Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: >-
          openpptbench rank data/evidence
          --products data/products
          --workflows data/workflows
          --config benchmark/config/capabilities-v0.2.yaml
          --output public/rankings.json
      - run: >-
          openpptbench build-site public/rankings.json
          --products data/products
          --workflows data/workflows
          --sources data/sources/catalog-v0.1.json
          --research data/research/landscape-v0.1.json
          --output-dir public/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
