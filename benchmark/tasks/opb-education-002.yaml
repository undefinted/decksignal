id: opb-education-002
version: "0.1.0"
track: prompt_to_deck
scenario: education
language: zh-CN
title: 用实验理解光合作用
prompt: >-
  为初中二年级学生设计一份9页的《用实验理解光合作用》课堂演示，授课时长20分钟。需要包含学习目标、
  必要概念、一个使用水草和不同光照条件的课堂实验、变量控制、安全提醒、观察记录表、结果讨论问题和
  课后小测。不要把实验的预期现象说成所有条件下都必然发生。中文，适合投影阅读。
constraints:
  slide_count_min: 9
  slide_count_max: 9
  audience: 初中二年级学生
  required_sections: [学习目标, 概念, 实验步骤, 变量, 安全, 记录表, 讨论, 小测]
checks:
  - id: experimental-variables
    question: 是否识别自变量、因变量和控制变量？
    weight: 3
  - id: safety
    question: 是否包含明确且适龄的安全提醒？
    weight: 2
  - id: uncertainty
    question: 是否避免把预期现象描述为无条件必然结果？
    weight: 2

